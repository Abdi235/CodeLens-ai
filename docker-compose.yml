# CodeLens local stack — RabbitMQ via CloudAMQP (set RABBITMQ_URL in .env)

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-codelens}
      POSTGRES_USER: ${DB_USER:-codelens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codelens}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codelens} -d ${DB_NAME:-codelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: postgresql://${DB_USER:-codelens}:${DB_PASSWORD:-codelens}@database:5432/${DB_NAME:-codelens}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-codelens}
      DB_USER: ${DB_USER:-codelens}
      DB_PASSWORD: ${DB_PASSWORD:-codelens}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SECUREAI_RABBITMQ_ENABLED: ${SECUREAI_RABBITMQ_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-CodeLensComposeSecretKeyMustBeLongEnoughForHS256Algorithms!!}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      WORKSPACE_DIR: /tmp/codelens-workspace
    depends_on:
      database:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ai-service/Dockerfile.worker
    environment:
      WORKER_ID: worker-1
      DATABASE_URL: postgresql://${DB_USER:-codelens}:${DB_PASSWORD:-codelens}@database:5432/${DB_NAME:-codelens}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      FILE_WORKERS: ${FILE_WORKERS:-4}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKSPACE_DIR: /tmp/codelens-workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: ai-service/Dockerfile.worker
    environment:
      WORKER_ID: worker-2
      DATABASE_URL: postgresql://${DB_USER:-codelens}:${DB_PASSWORD:-codelens}@database:5432/${DB_NAME:-codelens}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      FILE_WORKERS: ${FILE_WORKERS:-4}
      WORKSPACE_DIR: /tmp/codelens-workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
