# Copy from repository root: docker compose uses context .

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-secureai}
      POSTGRES_USER: ${DB_USER:-secureai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureai} -d ${DB_NAME:-secureai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-secureai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secureai}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-secureai}
      DB_USER: ${DB_USER:-secureai}
      DB_PASSWORD: ${DB_PASSWORD:-secureai}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-secureai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secureai}
      JWT_SECRET: ${JWT_SECRET:-SecureAIComposeSecretKeyMustBeLongEnoughForHS256Algorithms!!}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      WORKSPACE_DIR: /tmp/secureai-workspace
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ai-service/Dockerfile.worker
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-secureai}
      DB_USER: ${DB_USER:-secureai}
      DB_PASSWORD: ${DB_PASSWORD:-secureai}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-secureai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secureai}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      FILE_WORKERS: ${FILE_WORKERS:-4}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKSPACE_DIR: /tmp/secureai-workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: ai-service/Dockerfile.worker
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-secureai}
      DB_USER: ${DB_USER:-secureai}
      DB_PASSWORD: ${DB_PASSWORD:-secureai}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-secureai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secureai}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-1}
      FILE_WORKERS: ${FILE_WORKERS:-4}
      WORKSPACE_DIR: /tmp/secureai-workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
