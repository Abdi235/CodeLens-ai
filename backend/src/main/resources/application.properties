spring.application.name=CodeLens
spring.profiles.active=dev

server.port=8080

secureai.jwt.secret=${JWT_SECRET:SecureAIDevSecretKeyThatIsAtLeast256BitsLongForHS256!!}
secureai.jwt.expiration-ms=86400000
secureai.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
secureai.workspace-dir=${WORKSPACE_DIR:./workspace}
secureai.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
secureai.rabbitmq.prefetch=${RABBITMQ_PREFETCH:1}
secureai.worker-url=${WORKER_URL:}
secureai.ops-agent.max-steps=${OPS_AGENT_MAX_STEPS:8}
secureai.ops-agent.prefer-openai=${OPS_AGENT_PREFER_OPENAI:true}
secureai.ops-agent.model=${OPS_AGENT_MODEL:gpt-4o-mini}
secureai.ops-agent.stuck-job-minutes=${OPS_AGENT_STUCK_MINUTES:2}

secureai.oauth.frontend-url=${FRONTEND_URL:http://localhost:3000}
secureai.oauth.api-public-url=${API_PUBLIC_URL:http://localhost:8080}
secureai.oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
secureai.oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
secureai.oauth.microsoft.client-id=${OAUTH_MICROSOFT_CLIENT_ID:}
secureai.oauth.microsoft.client-secret=${OAUTH_MICROSOFT_CLIENT_SECRET:}

secureai.mail.enabled=${MAIL_ENABLED:false}
secureai.mail.from=${MAIL_FROM:noreply@codelens.app}
secureai.mail.from-name=${MAIL_FROM_NAME:CodeLens}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info,metrics
