spring.datasource.url=jdbc:h2:mem:secureai-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

secureai.rabbitmq.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

secureai.oauth.frontend-url=http://localhost:3000
secureai.oauth.api-public-url=http://localhost:8080
secureai.mail.enabled=false
spring.mail.host=
