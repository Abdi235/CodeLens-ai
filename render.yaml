# CodeLens backend stack on Render
# Frontend: Vercel — set VITE_API_URL to the codelens-api URL.
# Queue: CloudAMQP — set RABBITMQ_URL in Render dashboard (do not commit).

databases:
  - name: codelens-db
    plan: free
    databaseName: codelens
    user: codelens
    postgresMajorVersion: "16"

services:
  - type: web
    name: codelens-ai
    runtime: docker
    plan: free
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: codelens-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: SECUREAI_RABBITMQ_ENABLED
        value: "true"
      - key: AI_SERVICE_URL
        fromService:
          name: codelens-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        value: https://secure-ai-lac.vercel.app,http://localhost:5173
      - key: WORKSPACE_DIR
        value: /tmp/codelens-workspace

  - type: worker
    name: codelens-worker
    runtime: docker
    plan: free
    dockerfilePath: ./ai-service/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: WORKER_ID
        value: render-worker-1
      - key: DATABASE_URL
        fromDatabase:
          name: codelens-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WORKSPACE_DIR
        value: /tmp/codelens-workspace
